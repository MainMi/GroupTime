# Keeps the free Render instance awake.
#
# Render's free tier spins a service down after ~15 minutes without traffic, and
# the next request then pays a 30-60s cold start. Pinging a cheap endpoint every
# 10 minutes keeps it warm so the demo answers immediately.
#
# GitHub delays scheduled runs under load, so the real interval drifts to
# ~10-20 minutes. That is still inside Render's idle window most of the time.
# GitHub also disables cron workflows after 60 days without repository activity —
# re-enable it from the Actions tab if the demo starts sleeping again.
name: Keep API awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        run: |
          # --max-time covers a cold start; the endpoint is static, so this is
          # the cheapest way to wake the service without touching the database.
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 120 \
            https://grouptime.onrender.com/api/docs/)
          echo "API responded with HTTP $code"
          # Any answer at all means the instance is awake; only a dead service
          # (curl failure or 5xx) should fail the run.
          if [ "$code" -ge 500 ] || [ "$code" -eq 000 ]; then
            echo "::error::API is not healthy (HTTP $code)"
            exit 1
          fi
